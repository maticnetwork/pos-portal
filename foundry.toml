[profile.default]
src = "contracts"
out = "out"
test = "forge"
optimizer = true
optimizer_runs = 200
libs = [
    "lib",
    "node_modules",
]
remappings = [
    "@openzeppelin/=node_modules/@openzeppelin/",
    "@openzeppelin-v5/=lib/openzeppelin-contracts-v5/contracts",
    "forge-std/=lib/forge-std/src/",
    "hardhat/=node_modules/hardhat/",
]

evm_version = "istanbul"

memory_limit = 40003554432
gas_limit = "18446744073709551615"

ffi = true

fs_permissions = [{ access = "read", path = "./forge/"}, { access = "read", path = "./out/"}, { access = "read", path = "./lib/"}, { access = "read", path = "./test/"}, { access = "read", path = "./contracts/"}, { access = "read", path = "./scripts/"}]

# Deployed compiler settings are NOT uniform — see scripts/pinning/pinned-contracts.json for the
# authoritative per-contract record. Two of them can be expressed here, the rest cannot:
#
#   runs=200          the default below; matches 6 of 8 predicates, ChildChainManager
#   runs=999999       RootChainManager + ERC20Predicate (redeployed via Foundry, Aug 2025) — pinned
#                     per-path below, so a plain `forge build` reproduces them
#   optimizer OFF     11 of the 12 proxy shells (ChainExitERC1155PredicateProxy is the exception,
#                     built ON), both UChildERC20 builds and UChildDAI. Forge restrictions support
#                     `optimizer_runs` but not `optimizer`, so this one cannot be expressed here —
#                     scripts/pinning/verify-bytecode.sh builds those with the optimizer disabled.
[[profile.default.additional_compiler_profiles]]
name = "high-runs"
optimizer_runs = 999999

[[profile.default.compilation_restrictions]]
paths = "contracts/root/RootChainManager/RootChainManager.sol"
optimizer_runs = 999999

[[profile.default.compilation_restrictions]]
paths = "contracts/root/TokenPredicates/ERC20Predicate.sol"
optimizer_runs = 999999

[lint]
lint_on_build= false

[rpc_endpoints]
# Defaults use Tenderly's public gateways — no key required, rate-limited.
# Override any of these by setting MAINNET_RPC_URL / POLYGON_POS_RPC_URL etc.
# in your shell environment if you need higher limits or a private endpoint.
anvil = "http://127.0.0.1:8545"
mainnet = "https://mainnet.gateway.tenderly.co"
sepolia = "https://sepolia.gateway.tenderly.co"
polygon_pos = "https://polygon.gateway.tenderly.co"
polygon_amoy = "https://polygon-amoy.gateway.tenderly.co"

# See more config options https://github.com/foundry-rs/foundry/blob/master/crates/config/README.md#all-options

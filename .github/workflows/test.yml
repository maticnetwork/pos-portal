name: CI

on:
  pull_request:
  push:
    branches: [master, main, dev]
  workflow_dispatch:

jobs:
  test:
    name: Build, lint and test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      # Pinned, not stable/nightly: forge 1.8+ emits dynamic test-linking helpers that solc 0.6.6
      # cannot parse, so any newer forge fails to build the test tree.
      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1
        with:
          version: v1.7.1

      - name: Setup Node.js environment
        uses: actions/setup-node@v4
        with:
          node-version-file: ".nvmrc"
          cache: npm

      - name: Install npm dependencies
        run: npm ci

      - name: Show tool versions
        run: |
          forge --version
          node --version

      - name: Check JS formatting
        run: npm run fmt:js:check

      - name: Lint JS
        run: npm run lint:js

      # Errors fail the build; warnings do not. See .solhintrc — several
      # `solhint:recommended` rules assume >=0.8 and are disabled for 0.6.6.
      - name: Lint Solidity
        run: npm run lint:sol

      # `forge fmt --check` is deliberately absent: current Foundry releases
      # cannot format pre-0.8 sources, and every contract here is pinned to 0.6.6.

      - name: Generate interfaces
        run: npm run generate:interfaces

      - name: Build contracts
        run: forge build --sizes

      # Fork tests are excluded — they need an archive RPC. Everything else runs.
      - name: Forge tests
        run: forge test -vvv --no-match-test "SkipCI" --no-match-contract "Fork"

      # Hardhat's in-process network backs these; no external chain needed.
      # `npm run testrpc` (anvil) is only for the localhost networks in hardhat.config.cjs.
      - name: Hardhat tests
        run: npm test
